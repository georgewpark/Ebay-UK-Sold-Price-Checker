<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Scan a barcode and see what it recently sold for on eBay UK."
    />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="eBay UK - Sold Price Checker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Resolve both lookup APIs early, but do not hold sockets open for them.
         The first scan is several seconds away at best, by which time a
         preconnect made here has idled out, so the app opens the connections
         itself when the camera starts. See warmLookups in src/lib/lookup.ts. -->
    <link rel="dns-prefetch" href="https://world.openfoodfacts.org" />
    <link rel="dns-prefetch" href="https://api.upcitemdb.com" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Safari ignores an SVG here and screenshots the page instead. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="eBay UK - Sold Price Checker" />
    <meta
      property="og:description"
      content="Scan a barcode and see what it recently sold for on eBay UK."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <title>eBay UK - Sold Price Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
