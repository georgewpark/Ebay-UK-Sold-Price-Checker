name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push should cancel the first: nobody needs the results of a commit
# that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      # The build also runs the guard that catches two copies of zxing-wasm,
      # which is the failure mode that only shows up on Safari, at runtime.
      - name: Build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-size.mjs

  # Kept separate: it needs a browser download, and a red unit test should not
  # wait on one to tell you what is wrong.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Generates the fake camera feed, then scans it in a real browser.
      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
